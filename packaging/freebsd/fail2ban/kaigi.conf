# Match only fixed Kaigi security events, never client-provided log text.
# Installation, named-instance jails and PF/IPFW examples: README.md in this directory.
[Definition]
failregex = ^\{"timestamp":\s*"[^"]*",\s*"component":\s*"conference-security",\s*"event":\s*"authentication_failed",\s*"ip":\s*"<HOST>",\s*"reason":\s*"invalid_credentials"\}\s*$
ignoreregex =
datepattern = (?<="timestamp":")%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?Z
